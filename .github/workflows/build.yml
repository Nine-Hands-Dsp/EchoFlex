name: Build Echoflex VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Echoflex-VST3-Windows
          path: build/Echoflex_artefacts/Release/VST3/

  macos:
    runs-on: macos-15-intel   # Mac Intel : file Apple Silicon saturée (binaire universel quand même)
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign (ad-hoc) and zip
        run: |
          codesign --force --deep -s - build/Echoflex_artefacts/Release/VST3/ECHOFLEX.vst3
          cd build/Echoflex_artefacts/Release/VST3
          ditto -c -k --keepParent ECHOFLEX.vst3 Echoflex-VST3-macOS.zip

      - name: Upload VST3 (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: Echoflex-VST3-macOS
          path: build/Echoflex_artefacts/Release/VST3/Echoflex-VST3-macOS.zip

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les boutons du README (.../releases/latest/download/Echoflex-VST3-<OS>.zip) suivent chaque version.
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'^project\s*\(\s*\w+[^)]*?VERSION\s+([0-9.]+)',open('CMakeLists.txt').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Echoflex-VST3-Windows
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: Echoflex-VST3-macOS
          path: dist/mac
      - name: Archives
        run: |
          pack() {
            src="$1"; out="$GITHUB_WORKSPACE/$2"; wrap="$3"
            n=$(ls -A "$src" | wc -l); z=$(ls "$src"/*.zip 2>/dev/null | head -1)
            if [ "$n" = 1 ] && [ -n "$z" ]; then cp "$z" "$out"
            elif [ -n "$wrap" ]; then mkdir -p "pk/$wrap" && cp -a "$src"/. "pk/$wrap/" && (cd pk && zip -r -q -y "$out" "$wrap") && rm -rf pk
            else (cd "$src" && zip -r -q -y "$out" .); fi
          }
          pack dist/win "Echoflex-VST3-Windows.zip" ""
          pack dist/mac "Echoflex-VST3-macOS.zip" ""
          ls -l *.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="Echoflex-VST3-Windows.zip Echoflex-VST3-macOS.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest --title "Echoflex $TAG" --notes "Installation : voir le README (Windows : C:\Program Files\Common Files\VST3 ; macOS : ~/Library/Audio/Plug-Ins/VST3)."
          fi
